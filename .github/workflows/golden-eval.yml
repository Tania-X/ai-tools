name: golden-eval

# 评测 CI 化(生产化第 ③ 项): golden 场景量化评测跑在 GitHub Actions,
# 报告自动上传 + 写入 workflow summary。可手动触发或每天定时。
#
# 需要的 repo secrets:
#   GOLDEN_PAT        — 能 push Tania-X/ai-review-golden-tests 的 PAT(repo scope)
#   DEEPSEEK_API_KEY  — 驱动审查的 LLM key

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 01:00

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout golden repo
        uses: actions/checkout@v4
        with:
          repository: Tania-X/ai-review-golden-tests
          path: ../ai-review-golden-tests
          token: ${{ secrets.GOLDEN_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -q "httpx>=0.27" "PyYAML>=6.0"

      - name: Git identity (drive 需要 commit/push 测试分支)
        run: |
          cd ../ai-review-golden-tests
          git config user.email "actions@github.com"
          git config user.name "github-actions"

      - name: Run golden eval (Level 0)
        env:
          GITHUB_TOKEN: ${{ secrets.GOLDEN_PAT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python golden-tests/run_golden_tests.py --repo-dir ../ai-review-golden-tests --level 0

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: ../ai-review-golden-tests/results/

      - name: Write report to summary
        run: |
          cat ../ai-review-golden-tests/results/report-level0.md >> "$GITHUB_STEP_SUMMARY"
