# gateway 配置示例:复制为 gateway.toml(或任意位置)后,
# 通过环境变量 AI_GATEWAY_CONFIG=/path/to/gateway.toml 指向它。
# 价格请按最新官方价更新;留空则不核算成本,只统计 token。
default_provider = "deepseek"

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_keys = ["sk-你的key"]
model = "deepseek-chat"
max_tokens = 1024
temperature = 0.7
timeout = 60
max_retries = 3
cost_per_1k_input = 2.0
cost_per_1k_output = 8.0

# 多 provider 示例(多 key 用逗号分隔,自动轮询):
# [providers.kimi]
# base_url = "https://api.moonshot.cn"
# api_keys = ["sk-kimi-1", "sk-kimi-2"]
# model = "moonshot-v1-8k"
