[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools"
version = "0.1.0"
description = "AI × DevOps 工具集 —— LLM 网关 / PR 审查引擎 / MCP 仓库工具 / Golden 评测"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",  # pr-review 的 .ai-review.yaml 配置
    "ast-grep-py>=0.1",  # pr-review 的 agentic ast_grep 工具
]

[project.scripts]
ai-tools-cli = "ai_tools_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "fastmcp",
]

[tool.setuptools.packages.find]
where = [".", "pr-review", "golden-tests", "ci-diagnose"]
include = ["gateway*", "pr_review*", "golden*", "ci_diagnose*", "ai_tools_cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["gateway/tests", "pr-review/tests", "ci-diagnose/tests", "golden-tests/tests", "ai_tools_cli/tests"]
