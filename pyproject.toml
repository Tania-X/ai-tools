[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools"
version = "0.1.0"
description = "AI × DevOps 工具集 —— 独立 AI 能力层(gateway / pr-review / alert-explain / log-analyzer / ops-query / mcp-server)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",  # pr-review 的 .ai-review.yaml 配置
    "ast-grep-py>=0.1",  # pr-review 的 agentic ast_grep 工具
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "fastmcp",
]

[tool.setuptools.packages.find]
where = [".", "pr-review", "golden-tests", "ci-diagnose"]
include = ["gateway*", "pr_review*", "golden*", "ci_diagnose*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["gateway/tests", "pr-review/tests", "ci-diagnose/tests", "golden-tests/tests"]
