[project]
name = "ai-tools"
version = "0.1.0"
description = "AI × DevOps 工具集 —— 独立 AI 能力层(gateway / pr-review / alert-explain / log-analyzer / ops-query / mcp-server)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["gateway/tests"]
