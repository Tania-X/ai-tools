name: "AI PR Review"
description: "自建 CodeRabbit 替代 —— LLM 审查 PR diff 并发布 review 评论"

inputs:
  api-key:
    description: "LLM API key(DeepSeek / Kimi / OpenAI 兼容端点)"
    required: true
  base-url:
    description: "OpenAI 兼容端点,默认按 provider 内置(deepseek/kimi/openai)"
    required: false
    default: ""
  model:
    description: "模型名,默认 deepseek-chat(用 kimi/openai 时需显式传)"
    required: false
    default: "deepseek-chat"
  provider:
    description: "provider 名(deepseek / kimi / openai),默认 deepseek"
    required: false
    default: "deepseek"
  config-path:
    description: ".ai-review.yaml 路径(相对仓库根)"
    required: false
    default: ".ai-review.yaml"
  cost-per-1k-input:
    description: "输入单价(元/千 tokens)。留空不核算成本。⚠️ DeepSeek 2026-08-19 起峰谷分时定价,官方'元/百万'价需除以 1000 按实际时段填入"
    required: false
    default: ""
  cost-per-1k-output:
    description: "输出单价(元/千 tokens),同上"
    required: false
    default: ""
  otel-enabled:
    description: "启用 OpenTelemetry 上报(1/0), 默认 0"
    required: false
    default: "0"
  otel-endpoint:
    description: "OTLP 端点, 如 http://47.98.234.129:4318(带认证的端点配 otel-headers)"
    required: false
    default: ""
  otel-service-name:
    description: "服务名(平台 UI 区分应用), 默认 ai-tools-review"
    required: false
    default: "ai-tools-review"
  otel-headers:
    description: "OTLP 鉴权 header, 如 Authorization=Basic dXNlcjpwYXNz(配合认证网关)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: |
        pip install -q "httpx>=0.27" "PyYAML>=6.0" "ast-grep-py>=0.1" \
          "opentelemetry-api" "opentelemetry-sdk" "opentelemetry-exporter-otlp-proto-http"

    - name: Run AI PR review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        AI_GATEWAY_PROVIDER: ${{ inputs.provider }}
        AI_GATEWAY_API_KEYS: ${{ inputs.api-key }}
        AI_GATEWAY_BASE_URL: ${{ inputs.base-url }}
        AI_GATEWAY_MODEL: ${{ inputs.model }}
        AI_GATEWAY_COST_PER_1K_INPUT: ${{ inputs.cost-per-1k-input }}
        AI_GATEWAY_COST_PER_1K_OUTPUT: ${{ inputs.cost-per-1k-output }}
        AI_REVIEW_CONFIG: ${{ inputs.config-path }}
        OTEL_ENABLED: ${{ inputs.otel-enabled }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel-endpoint }}
        OTEL_SERVICE_NAME: ${{ inputs.otel-service-name }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel-headers }}
      run: python "${{ github.action_path }}/pr_review/main.py"
